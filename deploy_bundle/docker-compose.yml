services:
  app:
    image: tonermanagerv2-tonermanager:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      AAD_TENANT_ID: ${AAD_TENANT_ID}
      AAD_CLIENT_ID: ${AAD_CLIENT_ID}
      AAD_CLIENT_SECRET: ${AAD_CLIENT_SECRET}
      AAD_REDIRECT_URI: ${AAD_REDIRECT_URI}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    ports:
      - "3000:3000"

volumes:
  caddy_data:
  caddy_config:
